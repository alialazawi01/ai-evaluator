[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluator"
version = "0.1.0"
description = "Test and score AI systems with pluggable targets and checks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-eval = "ai_evaluator.cli:main"

[tool.setuptools.packages.find]
include = ["ai_evaluator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
